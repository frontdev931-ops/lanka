<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d8075" />
  <title>LANKA</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: grid; place-items: center; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); background: #f3f6f8; color: #14212b; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 380px; background: #fff; border: 1px solid #dde5ea; border-radius: 16px; padding: 28px 22px; text-align: center; box-shadow: 0 8px 30px rgba(20, 33, 43, 0.08); }
    img { width: 64px; height: 64px; border-radius: 14px; }
    h1 { font-size: 22px; margin: 14px 0 6px; }
    p { margin: 0 0 18px; color: #5b6b79; }
    button { min-height: 44px; padding: 0 22px; border: 0; border-radius: 10px; background: #0e9aa0; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="LANKA" />
    <h1 id="t">Немає зв’язку</h1>
    <p id="p">Перевірте інтернет і спробуйте ще раз. Дані пацієнтів на телефоні не зберігаються, тому без мережі показати їх неможливо.</p>
    <button id="b" type="button">Спробувати ще раз</button>
  </main>
  <script>
    // Сторінка самодостатня: працює без скриптів застосунку. Мова береться з вибору в застосунку.
    var L = {
      ru: ['Нет связи', 'Проверьте интернет и попробуйте ещё раз. Данные пациентов на телефоне не сохраняются, поэтому без сети показать их нельзя.', 'Попробовать ещё раз'],
      en: ['No connection', 'Check your internet and try again. Patient data is not stored on the phone, so it cannot be shown offline.', 'Try again']
    };
    try {
      var l = localStorage.getItem('stomat_lang');
      if (L[l]) {
        document.documentElement.lang = l;
        document.getElementById('t').textContent = L[l][0];
        document.getElementById('p').textContent = L[l][1];
        document.getElementById('b').textContent = L[l][2];
      }
    } catch (e) {}
    document.getElementById('b').onclick = function () { location.href = '/dashboard'; };
  </script>
</body>
</html>
